name: Stranger walk (production)

# Once a week, and on demand: the same walk as `npm run e2e:real` (host + invited parent, board, bring, edit,
# pictures, erasure) but against the DEPLOYED app, through « Essayer sans compte ». The sandbox it makes can send
# no mail and erases itself, so nothing leaves and nothing stays. Signal only.
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

jobs:
  walk:
    name: Walk the deployed app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:prod
        env:
          REAL_URL: https://jouer.marcportal.com
