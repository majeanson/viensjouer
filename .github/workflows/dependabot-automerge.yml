name: Dependabot auto-merge

# Minor and patch updates merge themselves once « CI & Deploy » is green on their branch
# (Babillard's rule, 2026-09-30). A major keeps waiting for a person. A merge made with
# this workflow's token starts no new run, so it dispatches « CI & Deploy » on main itself.
# Every value from the triggering run reaches the shell through `env:`, never `${{ }}`
# inside `run:`.

on:
  workflow_run:
    workflows: ['CI & Deploy']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge a green minor / patch update, then run CI & Deploy on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --head "$BRANCH" --state open --json number,title,headRefOid --jq '.[0] // empty')"
          if [ -z "$pr" ]; then echo "no open PR for $BRANCH (already merged?)"; exit 0; fi
          number="$(jq -r .number <<<"$pr")"
          title="$(jq -r .title <<<"$pr")"
          head="$(jq -r .headRefOid <<<"$pr")"
          if [ "$head" != "$HEAD_SHA" ]; then echo "PR #$number moved past the tested commit; waiting for its own run"; exit 0; fi
          ok=no
          case "$title" in
            *"the minor-and-patch group"*) ok=yes ;;
            *) from="$(sed -nE 's/.* from v?([0-9]+)\..* to v?([0-9]+)\..*/\1 \2/p' <<<"$title")"
               if [ -n "$from" ] && [ "$(cut -d' ' -f1 <<<"$from")" = "$(cut -d' ' -f2 <<<"$from")" ]; then ok=yes; fi ;;
          esac
          if [ "$ok" != yes ]; then echo "PR #$number is a major (or unreadable) update — left for a person: $title"; exit 0; fi
          gh pr merge "$number" --squash --delete-branch
          gh workflow run 'CI & Deploy' --ref main
